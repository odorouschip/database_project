<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goita — Play</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="nav">
    <a class="nav-logo" href="/matchmaking">GO<span>I</span>TA</a>
    <div class="nav-links">
      <a href="/matchmaking" class="active">Play</a>
      <a href="/leaderboard">Leaderboard</a>
      <a href="/account">Account</a>
      <a href="#" class="nav-logout" id="navLogout">Sign out</a>
    </div>
  </nav>

  <div class="page">
    <div class="flex-between" style="margin-bottom:28px; flex-wrap:wrap; gap:12px;">
      <div>
        <div class="page-title">Open Lobbies</div>
        <div class="page-sub mb-0">Team 1 — seats 1 &amp; 3 &nbsp;·&nbsp; Team 2 — seats 2 &amp; 4</div>
      </div>
      <button id="createBtn" class="btn btn-primary">+ New Game</button>
    </div>

    <p id="statusMessage" class="alert"></p>

    <div id="lobbiesContainer">
      <div style="color:var(--muted); font-size:13px;">Loading lobbies…</div>
    </div>
  </div>

  <script>
    let myPlayerId = null;
    let pollTimer  = null;

    function setStatus(msg, isError) {
      const el = document.getElementById("statusMessage");
      el.className = "alert " + (isError ? "alert-error" : "alert-success");
      el.textContent = msg || "";
    }

    async function loadCurrentUser() {
      const res  = await fetch("/api/account");
      const data = await res.json();
      if (!data.logged_in) { window.location.href = "/login"; return false; }
      myPlayerId = data.player_id;
      return true;
    }

    async function createGame() {
      if (myPlayerId === null && !(await loadCurrentUser())) return;
      const res  = await fetch("/api/create_game", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({})
      });
      if (res.status === 401) { window.location.href = "/login"; return; }
      const data = await res.json();
      if (data.status === "error") setStatus(data.message, true);
      else { setStatus("Lobby created — Game #" + data.game_id + ". You are in seat 1 (Team 1).", false); fetchOpenGames(); }
    }

    document.getElementById("createBtn").addEventListener("click", createGame);

    function makePips(count, filled) {
      let html = "";
      for (let i = 0; i < count; i++)
        html += `<span class="team-pip ${i < filled ? "filled" : ""}"></span>`;
      return html;
    }

    async function fetchOpenGames() {
      if (myPlayerId === null && !(await loadCurrentUser())) return;
      const res = await fetch("/api/open_games");
      if (res.status === 401) { window.location.href = "/login"; return; }
      const games = await res.json();
      const container = document.getElementById("lobbiesContainer");

      if (!Array.isArray(games) || games.length === 0) {
        container.innerHTML = `<div class="card" style="text-align:center; padding:36px 24px;">
          <div style="color:var(--muted); margin-bottom:12px;">No open lobbies right now.</div>
          <button class="btn btn-primary btn-sm" onclick="createGame()">Create the first one</button>
        </div>`;
        return;
      }

      container.innerHTML = games.map(function(game) {
        const t1 = game.team1_count || 0;
        const t2 = game.team2_count || 0;
        const pc = game.player_count || 0;
        const gid = game.game_id;
        const inHere = game.in_this_lobby;
        const fullLobby = t1 === 2 && t2 === 2 && pc === 4;

        const dateStr = game.started_time
          ? `<span class="text-muted small">Started ${game.started_time}</span>`
          : "";

        let actions = "";
        if (inHere) {
          if (fullLobby) {
            actions = `<button class="btn btn-primary btn-sm" type="button" onclick="startGame(${gid})">Start game</button>`;
          } else {
            actions = `<button class="btn btn-ghost btn-sm" type="button" disabled>Waiting for players…</button>`;
          }
        } else {
          actions =
            `<button class="btn btn-t1 btn-sm" ${t1 >= 2 ? "disabled" : `onclick="joinGame(${gid},1)"`}>Join Team 1</button>` +
            `<button class="btn btn-t2 btn-sm" ${t2 >= 2 ? "disabled" : `onclick="joinGame(${gid},2)"`}>Join Team 2</button>`;
        }

        return `<div class="lobby-card ${inHere ? "mine" : ""}">
          <div style="min-width:70px;">
            <div style="font-size:13px; font-weight:600;">Game #${gid}</div>
            ${dateStr}
          </div>
          <div class="lobby-teams">
            <div class="team-slot t1">
              <div>
                <div class="team-label">Team 1</div>
                <div style="display:flex;gap:4px;margin-top:4px;">${makePips(2, t1)}</div>
              </div>
              <div style="margin-left:auto; font-size:12px; color:var(--muted);">${t1}/2</div>
            </div>
            <div class="team-slot t2">
              <div>
                <div class="team-label">Team 2</div>
                <div style="display:flex;gap:4px;margin-top:4px;">${makePips(2, t2)}</div>
              </div>
              <div style="margin-left:auto; font-size:12px; color:var(--muted);">${t2}/2</div>
            </div>
          </div>
          <div class="lobby-actions">${actions}</div>
        </div>`;
      }).join("");
    }

    async function joinGame(gameId, teamNumber) {
      const res  = await fetch("/api/join_game", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ game_id: gameId, team_number: teamNumber })
      });
      if (res.status === 401) { window.location.href = "/login"; return; }
      const data = await res.json();
      if (data.status === "error") setStatus(data.message, true);
      else setStatus(data.message, false);
      fetchOpenGames();
    }

    async function checkMyMatch() {
      if (myPlayerId === null && !(await loadCurrentUser())) return;
      const res = await fetch("/api/my_match");
      if (res.status === 401) { window.location.href = "/login"; return; }
      const d = await res.json();
      if (d && d.at_table && d.game_id) {
        window.location.href = "/play/" + d.game_id;
      }
    }

    async function startGame(gameId) {
      if (myPlayerId === null && !(await loadCurrentUser())) return;
      const res = await fetch("/api/start_game", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ game_id: gameId })
      });
      if (res.status === 401) { window.location.href = "/login"; return; }
      const data = await res.json();
      if (data.status === "error") { setStatus(data.message, true); return; }
      if (data.game_id) {
        setStatus("Starting game…", false);
        window.location.href = "/play/" + data.game_id;
        return;
      }
      setStatus(data.message || "Game started.", false);
    }

    async function matchmakingTick() {
      if (myPlayerId === null && !(await loadCurrentUser())) return;
      await checkMyMatch();
      await fetchOpenGames();
    }

    window.addEventListener("load", async function() {
      if (!(await loadCurrentUser())) return;
      await matchmakingTick();
      pollTimer = setInterval(matchmakingTick, 2000);
    });
    window.addEventListener("beforeunload", function() { if (pollTimer) clearInterval(pollTimer); });
    document.addEventListener("visibilitychange", function() {
      if (document.visibilityState === "visible") matchmakingTick();
    });

    document.getElementById("navLogout").addEventListener("click", async function(e) {
      e.preventDefault();
      const res = await fetch("/api/logout", { method: "POST", headers: { "Content-Type": "application/json" } });
      if (res.ok) window.location.href = "/login?logout=1";
    });
  </script>
</body>
</html>
