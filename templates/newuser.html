<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goita — Create Account</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card" style="max-width:420px;">
      <div class="auth-logo">GO<span>I</span>TA</div>

      <form id="createForm">
        <div class="field">
          <label class="field-label" for="username">Username</label>
          <input type="text" id="username" placeholder="Choose a username" required autocomplete="username">
        </div>

        <div class="field">
          <label class="field-label" for="password">Password</label>
          <input type="password" id="password" placeholder="Create a password" required autocomplete="new-password">
        </div>

        <ul class="req-list" id="reqList" style="margin-bottom:16px;">
          <li id="req-length">At least 8 characters</li>
          <li id="req-upper">Contains an uppercase letter</li>
          <li id="req-lower">Contains a lowercase letter</li>
          <li id="req-number">Contains a number</li>
          <li id="req-special">Contains a special character (!@#$%^&*)</li>
        </ul>

        <div class="field">
          <label class="field-label" for="confirm">Confirm Password</label>
          <input type="password" id="confirm" placeholder="Repeat your password" required autocomplete="new-password">
        </div>

        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      </form>

      <p id="error" class="alert alert-error"></p>

      <div class="auth-footer">
        Already have an account? <a href="/login">Sign in</a>
      </div>
    </div>
  </div>

  <script>
    const pwdInput = document.getElementById("password");
    const checks = {
      "req-length":  p => p.length >= 8,
      "req-upper":   p => /[A-Z]/.test(p),
      "req-lower":   p => /[a-z]/.test(p),
      "req-number":  p => /[0-9]/.test(p),
      "req-special": p => /[!@#$%^&*]/.test(p),
    };

    pwdInput.addEventListener("input", function() {
      const p = pwdInput.value;
      Object.entries(checks).forEach(([id, fn]) => {
        document.getElementById(id).classList.toggle("met", fn(p));
      });
    });

    document.getElementById("createForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const confirm  = document.getElementById("confirm").value;
      const errorEl  = document.getElementById("error");
      errorEl.innerText = "";

      if (password !== confirm) { errorEl.innerText = "Passwords do not match."; return; }
      if (!Object.values(checks).every(fn => fn(password))) {
        errorEl.innerText = "Password does not meet all requirements."; return;
      }

      const res = await fetch("/api/create_account", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();
      if (res.status === 409) { errorEl.innerText = "Username already taken."; return; }
      if (res.status === 400) { errorEl.innerText = "Invalid password format."; return; }
      if (res.ok) { window.location.href = "/login?created=1"; return; }
      errorEl.innerText = data.message || "Failed to create account.";
    });
  </script>
</body>
</html>
