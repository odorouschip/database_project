<!DOCTYPE html>
<html>
<head>
    <title>Create Account</title>
</head>
<body>
    <h2>Create Account</h2>

    <form id="createForm">
        <input type="text" id="username" placeholder="Username" required>
        <br><br>

        <input type="password" id="password" placeholder="Password" required>
        <br><br>

        <input type="password" id="confirm" placeholder="Confirm Password" required>
        <br><br>

        <button type="submit">Create Account</button>
    </form>

    <p id="error" style="color:red;"></p>

    <p>
        Already have an account?
        <a href="/login">
            <button type="button">Back to login</button>
        </a>
    </p>
    <p id="error" style="color:red;"></p>

    <script>
        document.getElementById("createForm").addEventListener("submit", async function(e) {
            e.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const confirm  = document.getElementById("confirm").value;

            if (password !== confirm) {
                document.getElementById("error").innerText = "Passwords do not match";
                return;
            }

            const res = await fetch("/api/create_account", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ username, password })
            });
		
	    const data = await res.json();
	    
	    if (res.status === 409) {
		document.getElementById("error").innerText = "Username already exists";
		return;
	    }

            if (res.ok) {
                window.location.href = "/login?created=1";
                return;
            }

            document.getElementById("error").innerText = "Failed to create account";
        });
    </script>
</body>
</html>
