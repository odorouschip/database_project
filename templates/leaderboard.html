<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goita — Leaderboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="nav">
    <a class="nav-logo" href="/matchmaking">GO<span>I</span>TA</a>
    <div class="nav-links">
      <a href="/matchmaking">Play</a>
      <a href="/leaderboard" class="active">Leaderboard</a>
      <a href="/account">Account</a>
    </div>
  </nav>

  <div class="page">
    <div class="page-title">Leaderboard</div>
    <div class="page-sub">Top players ranked by win rate</div>

    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input type="text" id="searchInput" placeholder="Search player…" oninput="fetchLeaderboard()">
    </div>

    <div class="card" style="padding:0; overflow:hidden;">
      <table class="data-table" id="leaderboardTable">
        <thead>
          <tr>
            <th style="width:52px;">Rank</th>
            <th>Player</th>
            <th>Wins</th>
            <th>Losses</th>
            <th>Win Rate</th>
          </tr>
        </thead>
        <tbody id="leaderboardBody">
          <tr><td colspan="5" style="padding:24px; color:var(--muted); font-size:13px;">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    async function fetchLeaderboard() {
      const q = document.getElementById("searchInput").value;
      const res = await fetch("/api/leaderboard?search=" + encodeURIComponent(q));
      const data = await res.json();
      const tbody = document.getElementById("leaderboardBody");

      if (!data.length) {
        tbody.innerHTML = '<tr><td colspan="5" style="padding:24px; color:var(--muted); font-size:13px;">No players found.</td></tr>';
        return;
      }

      tbody.innerHTML = data.map(function(p) {
        let badgeClass = "";
        if (p.rank === 1) badgeClass = "gold";
        else if (p.rank === 2) badgeClass = "silver";
        else if (p.rank === 3) badgeClass = "bronze";

        return `<tr>
          <td><span class="rank-badge ${badgeClass}">${p.rank}</span></td>
          <td style="font-weight:500;">${p.username}</td>
          <td class="text-win">${p.wins}</td>
          <td class="text-muted">${p.losses}</td>
          <td style="font-weight:500;">${p.win_rate}%</td>
        </tr>`;
      }).join("");
    }

    window.onload = fetchLeaderboard;
  </script>
</body>
</html>
