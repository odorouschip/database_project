<!DOCTYPE html>
<html>
<head>
    <title>Account</title>
</head>
<body>
    <h2>Account</h2>

    <p>
        Logged in as: <span id="usernameDisplay">Loading...</span>
    </p>

    <br>

    <button id="showUsernameFormButton">
        Change Username
    </button>

    <div id="usernameFormContainer" style="display:none; margin-top:12px;">
        <input
            type="text"
            id="newUsername"
            placeholder="Enter new username"
            required
        >
        <button id="submitUsernameChange">
            Submit Username Change
        </button>
    </div>

    <br><br>

    <button id="showPasswordFormButton">
        Change Password
    </button>

    <div id="passwordFormContainer" style="display:none; margin-top:12px;">
        <ul style="margin-bottom:10px;">
            <li>At least 8 characters</li>
            <li>Contains an uppercase letter</li>
            <li>Contains a lowercase letter</li>
            <li>Contains a number</li>
            <li>Contains a special character</li>
        </ul>

        <input
            type="password"
            id="newPassword"
            placeholder="Enter new password"
            required
        >
        <br><br>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            required
        >
        <br><br>

        <button id="submitPasswordChange">
            Submit Password Change
        </button>
    </div>

    <br><br>

    <button id="deleteAccountButton">
        Delete Account
    </button>
    
    <button id="logoutButton">
        Logout
    </button>

    <p id="error" style="color:red;"></p>
    <p id="message" style="color:green;"></p>

    <h3 style="margin-top:24px;">Past Matches</h3>
    <div id="pastMatchesContainer">Loading...</div>

    <script>
        async function loadAccountInfo() {
            const res = await fetch("/api/account", {
                method: "GET",
                headers: {
                    "Content-Type": "application/json"
                }
            });

            if (!res.ok) {
                document.getElementById("error").innerText =
                    "Could not load account info.";
                return;
            }

            const data = await res.json();

            if (!data.logged_in) {
                window.location.href = "/login";
                return;
            }

            document.getElementById("usernameDisplay").innerText =
                data.username;
        }

        document.getElementById("showUsernameFormButton").addEventListener(
            "click",
            function () {
                const form = document.getElementById("usernameFormContainer");
                form.style.display =
                    form.style.display === "none" ? "block" : "none";
            }
        );

        document.getElementById("showPasswordFormButton").addEventListener(
            "click",
            function () {
                const form = document.getElementById("passwordFormContainer");
                form.style.display =
                    form.style.display === "none" ? "block" : "none";
            }
        );

        document.getElementById("submitUsernameChange").addEventListener(
            "click",
            async function () {
                document.getElementById("error").innerText = "";
                document.getElementById("message").innerText = "";

                const newUsername =
                    document.getElementById("newUsername").value;

                const res = await fetch("/api/change_username", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ username: newUsername })
                });

                const data = await res.json();

                if (res.ok) {
                    document.getElementById("message").innerText =
                        "Username changed successfully.";
                    document.getElementById("usernameDisplay").innerText =
                        newUsername;
                    document.getElementById("newUsername").value = "";
                    document.getElementById("usernameFormContainer").style.display =
                        "none";
                    return;
                }

                document.getElementById("error").innerText =
                    data.message || "Failed to change username.";
            }
        );

        document.getElementById("submitPasswordChange").addEventListener(
            "click",
            async function () {
                document.getElementById("error").innerText = "";
                document.getElementById("message").innerText = "";

                const password =
                    document.getElementById("newPassword").value;
                const confirm =
                    document.getElementById("confirmPassword").value;

                if (password !== confirm) {
                    document.getElementById("error").innerText =
                        "Passwords do not match.";
                    return;
                }

                const valid =
                    password.length >= 8 &&
                    /[A-Z]/.test(password) &&
                    /[a-z]/.test(password) &&
                    /[0-9]/.test(password) &&
                    /[^A-Za-z0-9]/.test(password);

                if (!valid) {
                    document.getElementById("error").innerText =
                        "Password does not meet requirements.";
                    return;
                }

                const res = await fetch("/api/change_password", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ password: password })
                });

                const data = await res.json();

                if (res.ok) {
                    document.getElementById("message").innerText =
                        "Password changed successfully.";
                    document.getElementById("newPassword").value = "";
                    document.getElementById("confirmPassword").value = "";
                    document.getElementById("passwordFormContainer").style.display =
                        "none";
                    return;
                }

                document.getElementById("error").innerText =
                    data.message || "Failed to change password.";
            }
        );

        document.getElementById("deleteAccountButton").addEventListener(
            "click",
            async function () {
                const confirmed = confirm(
                    "Are you sure you want to delete your account?"
                );

                if (!confirmed) {
                    return;
                }

                const res = await fetch("/api/delete_account", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    }
                });

                const data = await res.json();

                if (res.ok) {
                    window.location.href = "/login?deleted=1";
                    return;
                }

                document.getElementById("error").innerText =
                    data.message || "Failed to delete account.";
            }
        );

        document.getElementById("logoutButton").addEventListener(
            "click",
            async function () {
                const res = await fetch("/api/logout", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    }
                });

                if (res.ok) {
                    window.location.href = "/login?logout=1";
                    return;
                }

                document.getElementById("error").innerText =
                    "Failed to log out.";
            }
        );

        async function loadPastMatches() {
            const container = document.getElementById("pastMatchesContainer");

            const res = await fetch("/api/past_matches");
            if (!res.ok) {
                container.innerText = "Could not load past matches.";
                return;
            }

            const matches = await res.json();

            if (matches.length === 0) {
                container.innerText = "No past matches yet.";
                return;
            }

            container.innerHTML = "";
            matches.forEach(function (m) {
                const dateStr = m.ended_time ? m.ended_time.split("T")[0] : "";
                const teammateName = m.teammate ? m.teammate.username : "(none)";
                const opponentNames = m.opponents
                    .map(function (o) { return o.username; })
                    .join(" & ");

                const row = document.createElement("div");
                row.style.border = "1px solid #ccc";
                row.style.padding = "8px";
                row.style.marginBottom = "6px";
                row.innerHTML =
                    "<strong>with " + teammateName + " vs " + opponentNames + "</strong>" +
                    " &nbsp; " + dateStr +
                    " &nbsp; " + m.my_score + "-" + m.opp_score +
                    " &nbsp; <span style='color:" +
                    (m.result === "Win" ? "green" : "red") + ";'>" +
                    m.result + "</span>" +
                    " &nbsp; <a href='/match/" + m.game_id + "/summary'>View Summary</a>";
                container.appendChild(row);
            });
        }

        loadAccountInfo();
        loadPastMatches();
    </script>
</body>
</html>
